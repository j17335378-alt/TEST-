plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hajala.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hajala.app'
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName '1.7.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
